<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#444" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="50" y1="25" x2="50" y2="8" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="8" r="4" fill="#fff" />
  
  <!-- Ears -->
  <rect x="5" y="45" width="10" height="20" rx="3" fill="#666" />
  <rect x="85" y="45" width="10" height="20" rx="3" fill="#666" />
  
  <!-- Head/Body -->
  <rect x="15" y="25" width="70" height="60" rx="16" fill="url(#grad)" stroke="#888" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="25" y="35" width="50" height="35" rx="6" fill="url(#screen)" stroke="#555" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="40" cy="48" r="4" fill="#fff" />
  <circle cx="60" cy="48" r="4" fill="#fff" />
  
  <!-- Blushes -->
  <ellipse cx="32" cy="54" rx="4" ry="2" fill="#fff" opacity="0.2" />
  <ellipse cx="68" cy="54" rx="4" ry="2" fill="#fff" opacity="0.2" />
  
  <!-- Cute smile -->
  <path d="M 46 56 Q 50 60 54 56" fill="transparent" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
</svg>
